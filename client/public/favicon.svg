<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1016"/>
      <stop offset="50%" stop-color="#181326"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="45%" stop-color="#ff4e50"/>
      <stop offset="100%" stop-color="#f9d423"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge with Soft Glow -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#primary-grad)" stroke-width="12" stroke-opacity="0.6" />

  <!-- Center Film / Play Emblem with Glowing Neon Gradient -->
  <g transform="translate(0, 0)" filter="url(#neon-glow)">
    
    <!-- Stylized Movie 'M' Wings -->
    <path d="M120 370 V158 C120 146 132 138 142 144 L256 218 L370 144 C380 138 392 146 392 158 V370 C392 380 382 388 372 384 L336 370 C328 366 322 358 322 350 V236 L268 272 C260 277 252 277 244 272 L190 236 V350 C190 358 184 366 176 370 L140 384 C130 388 120 380 120 370 Z" 
          fill="url(#primary-grad)" />

    <!-- Center Glowing Play Triangle -->
    <polygon points="230,296 306,346 230,396" fill="#ffffff" opacity="0.95" />
    <polygon points="230,296 306,346 230,396" fill="url(#primary-grad)" opacity="0.75" />

    <!-- Top Film Reel Accent Dots -->
    <circle cx="160" cy="190" r="10" fill="#ffffff" opacity="0.9" />
    <circle cx="352" cy="190" r="10" fill="#ffffff" opacity="0.9" />
    <circle cx="256" cy="154" r="8" fill="#f9d423" />
  </g>
</svg>
